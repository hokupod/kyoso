# Publishes @kyo-so/cli to npm via OIDC trusted publishing.
# npmjs.com side must be configured first:
#   Package Settings > Trusted Publisher > GitHub Actions
#   owner=hokupod / repo=kyoso / workflow=release.yml / environment=release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Pin the version: safe-chain itself is a supply-chain trust anchor
      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.12

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      # Trusted publishing requires npm CLI 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json ($PKG_VERSION) != tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify package
        run: bun run pack:verify

      # No NODE_AUTH_TOKEN: authentication happens via OIDC, and provenance
      # is attached automatically for public repositories.
      - name: Publish
        run: npm publish --access public
