[mcp_servers.kyoso]
command = "npx"
args = [
  "-y",
  "--package=kyoso-mcp@npm:@kyo-so/cli@latest",
  "kyoso",
  "mcp",
  "--safe-chain-skip-minimum-package-age",
]
env_vars = [
  "OPENAI_API_KEY",
  "CODEX_API_KEY",
  "CODEX_HOME",
  "CODEX_ACCESS_TOKEN",
  "OPENROUTER_API_KEY",
  "ANTHROPIC_API_KEY",
  "CLAUDE_CODE_OAUTH_TOKEN",
]
