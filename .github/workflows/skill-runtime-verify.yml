# Manual only: this runs on a dedicated runner with a scoped Codex auth secret.
# It exercises Skill selection and the PATH fallback, never a real Kyoso review.
name: Skill runtime verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mcp-less-skill:
    name: MCP-less Skill smoke
    runs-on: [self-hosted, codex-authenticated]
    environment: codex-skill-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.14

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify MCP-less Skill fallback
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: bun run skill:runtime:verify
