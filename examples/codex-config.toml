[mcp_servers.kyoso]
command = "npx"
args = ["-y", "@kyo-so/cli", "mcp"]
env_vars = ["OPENAI_API_KEY", "CODEX_API_KEY", "ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN"]
startup_timeout_sec = 20
tool_timeout_sec = 360
enabled = true

