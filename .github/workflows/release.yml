# Publishes @kyo-so/cli to npm via OIDC trusted publishing.
# npmjs.com side must be configured first:
#   Package Settings > Trusted Publisher > GitHub Actions
#   owner=hokupod / repo=kyoso / workflow=release.yml / environment=release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  codex-acp-mock-sse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.14

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Codex ACP mock Responses SSE
        env:
          KYOSO_CODEX_ACP_MOCK_SSE: "1"
        run: bun test test/integration/codexAcpMockSse.test.ts test/unit/mockResponsesServer.test.ts

  release:
    needs: codex-acp-mock-sse
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node for packed config smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Capture packed config smoke Node binary
        run: |
          PACK_SMOKE_NODE="$(realpath "$(command -v node)")"
          echo "KYOSO_PACK_SMOKE_NODE=$PACK_SMOKE_NODE" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      # Pin the version: safe-chain itself is a supply-chain trust anchor
      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.14

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      # Trusted publishing requires npm CLI 11.5.1 or newer. Pin an exact
      # verified version instead of @latest: safe-chain's minimum-package-age
      # policy can silently resolve @latest to an older release (it downgraded
      # 12.0.1 to 12.0.0, whose global install loses libnpmpublish's bundled
      # sigstore and breaks provenance publishing).
      - name: Update npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json ($PKG_VERSION) != tag ($TAG_VERSION)" >&2
            exit 1
          fi

      # Fail before the approval gate when the release notes are missing.
      - name: Verify CHANGELOG has an entry for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for ${TAG_VERSION}" >&2
            exit 1
          fi

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Keep Plugin artifacts out of the npm package and reject manual mirror
      # edits before the release job reaches the OIDC publish step.
      - name: Verify Plugin distribution
        run: bun run plugin:verify

      - name: Check diff
        run: git diff --check

      - name: Verify package tarball
        run: bun run pack:verify

      # No NODE_AUTH_TOKEN: authentication happens via OIDC, and provenance
      # is attached automatically for public repositories.
      - name: Publish
        run: npm publish --access public

  # Separate job so the build/publish job never holds contents: write.
  github-release:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # Full history and tags, needed to list commits since the previous release
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no entry for ${VERSION}" >&2
            exit 1
          fi

      - name: Append commit list since previous release
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo ""
            echo "### Commits"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}"
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
          } >> release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release-notes.md

  # Publishing the CLI must not be blocked by a missed Plugin promotion.
  promotion-reminder:
    runs-on: ubuntu-latest
    needs: github-release
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Remind when Plugin pins lag behind the release
        id: promotion_reminder
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          extract_pin() {
            node -e '
              const [manifestPath, argvPath] = process.argv.slice(1);
              const manifest = JSON.parse(require("node:fs").readFileSync(manifestPath, "utf8"));
              const args = argvPath.split(".").reduce((value, key) => value[key], manifest);
              const prefix = "--package=kyoso-cli@npm:@kyo-so/cli@";
              const argument = args.find((entry) => entry.startsWith(prefix));
              if (argument === undefined) {
                throw new Error(`${manifestPath}: no argument starts with ${prefix}`);
              }
              process.stdout.write(argument.slice(prefix.length));
            ' "$1" "$2"
          }

          CODEX_PIN="$(extract_pin plugins/kyoso/.codex-plugin/mcp.json kyoso.args)"
          CLAUDE_PIN="$(extract_pin plugins/kyoso/.claude-plugin/plugin.json mcpServers.kyoso.args)"

          is_semver_older() {
            node -e '
              const [candidate, released] = process.argv.slice(1);
              const parse = (version) => {
                const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version);
                if (!match) throw new Error(`Invalid SemVer: ${version}`);
                const prerelease = match[4]?.split(".") ?? [];
                if (prerelease.some((identifier) => /^\d+$/.test(identifier) && identifier.length > 1 && identifier.startsWith("0"))) {
                  throw new Error(`Invalid SemVer prerelease: ${version}`);
                }
                return {
                  core: match.slice(1, 4).map((identifier) => BigInt(identifier)),
                  prerelease,
                };
              };
              const compare = (left, right) => {
                for (let index = 0; index < left.core.length; index += 1) {
                  if (left.core[index] !== right.core[index]) {
                    return left.core[index] < right.core[index] ? -1 : 1;
                  }
                }
                if (left.prerelease.length === 0 || right.prerelease.length === 0) {
                  if (left.prerelease.length === right.prerelease.length) return 0;
                  return left.prerelease.length === 0 ? 1 : -1;
                }
                const length = Math.max(left.prerelease.length, right.prerelease.length);
                for (let index = 0; index < length; index += 1) {
                  const leftIdentifier = left.prerelease[index];
                  const rightIdentifier = right.prerelease[index];
                  if (leftIdentifier === undefined) return -1;
                  if (rightIdentifier === undefined) return 1;
                  if (leftIdentifier === rightIdentifier) continue;
                  const leftNumeric = /^\d+$/.test(leftIdentifier);
                  const rightNumeric = /^\d+$/.test(rightIdentifier);
                  if (leftNumeric && rightNumeric) {
                    return BigInt(leftIdentifier) < BigInt(rightIdentifier) ? -1 : 1;
                  }
                  if (leftNumeric !== rightNumeric) return leftNumeric ? -1 : 1;
                  return leftIdentifier < rightIdentifier ? -1 : 1;
                }
                return 0;
              };
              process.stdout.write(compare(parse(candidate), parse(released)) < 0 ? "true" : "false");
            ' "$1" "$2"
          }

          CODEX_PIN_IS_OLDER="$(is_semver_older "$CODEX_PIN" "$RELEASE_VERSION")"
          CLAUDE_PIN_IS_OLDER="$(is_semver_older "$CLAUDE_PIN" "$RELEASE_VERSION")"
          if [ "$CODEX_PIN_IS_OLDER" != "true" ] && [ "$CLAUDE_PIN_IS_OLDER" != "true" ]; then
            echo "Plugin pins are not older than released CLI v${RELEASE_VERSION}; no promotion reminder needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # plugin:verify enforces these pins match. Keep the warning actionable
          # if an invalid repository state reaches this best-effort reminder.
          PLUGIN_PIN="$CODEX_PIN"
          if [ "$CODEX_PIN_IS_OLDER" != "true" ]; then
            PLUGIN_PIN="$CLAUDE_PIN"
          fi
          {
            echo "### Plugin promotion needed"
            echo
            echo "> [!WARNING]"
            echo "> CLI v${RELEASE_VERSION} was released, but the Plugin pin has not been promoted."
            echo
            echo "- Codex MCP pin: \`@kyo-so/cli@${CODEX_PIN}\`"
            echo "- Claude Code pin: \`@kyo-so/cli@${CLAUDE_PIN}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          ISSUE_TITLE="Plugin promotion needed: CLI v${RELEASE_VERSION} released, plugins pin v${PLUGIN_PIN}"
          OPEN_ISSUE_TITLES="$(gh search issues "$ISSUE_TITLE" \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --match title \
            --json title --limit 100 --jq '.[].title')"
          if printf '%s\n' "$OPEN_ISSUE_TITLES" | grep -Fxq "$ISSUE_TITLE"; then
            echo "An open promotion reminder already exists; skipping duplicate issue." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ISSUE_BODY="$(printf '%s\n' \
            "<!-- kyoso:plugin-promotion-reminder cli=${RELEASE_VERSION} -->" \
            "" \
            "CLI v${RELEASE_VERSION} was published, while the distributed Plugin pin is still behind it." \
            "" \
            "- Codex MCP pin: @kyo-so/cli@${CODEX_PIN}" \
            "- Claude Code pin: @kyo-so/cli@${CLAUDE_PIN}" \
            "" \
            "Run the Plugin promotion workflow to update both pins together.")"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY"

      - name: Report promotion reminder failure
        if: ${{ failure() || steps.promotion_reminder.outcome == 'failure' }}
        run: |
          {
            echo "### Plugin promotion reminder failed"
            echo
            echo "> [!WARNING]"
            echo "> The CLI release succeeded, but the best-effort Plugin promotion reminder did not finish."
            echo
            echo "Review this job's logs before deciding whether the Plugin needs promotion."
          } >> "$GITHUB_STEP_SUMMARY"
