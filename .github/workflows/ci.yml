name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Pin the version: safe-chain itself is a supply-chain trust anchor
      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.13

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # Reject hand-edited Plugin mirrors and validate the pre-pack archive
      # allowlist before creating the actual npm tarball below.
      - name: Verify Plugin distribution
        run: bun run plugin:verify

      - name: Check diff
        run: git diff --check

      - name: Verify package tarball
        run: bun run pack:verify

  audit-runtime-ubuntu:
    name: Audit trace runtime (Ubuntu, ${{ matrix.runtime }} on Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20"
            runtime: node
          - node: "24"
            runtime: node
          - node: "24"
            runtime: bun
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Pin the version: safe-chain itself is a supply-chain trust anchor
      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.13

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build

      - name: Verify built CLI audit trace
        run: ${{ matrix.runtime }} scripts/verify-audit-runtime.mjs

  audit-runtime-macos:
    name: Audit trace runtime (macOS, ${{ matrix.runtime }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Pin the version: safe-chain itself is a supply-chain trust anchor
      - name: Install safe-chain
        run: npm install -g @aikidosec/safe-chain@1.5.13

      - name: Setup safe-chain shims
        run: safe-chain setup-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build

      - name: Verify built CLI audit trace
        run: ${{ matrix.runtime }} scripts/verify-audit-runtime.mjs
